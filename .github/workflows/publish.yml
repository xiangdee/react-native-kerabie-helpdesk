name: Publish to npm

# Publishes when you push a version tag that matches package.json, e.g. `git tag v1.0.2 && git push --tags`.
# Needs one repository secret: NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
